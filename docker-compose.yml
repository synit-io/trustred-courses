services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: "${APP_NAME:-Aid Org Courses}"
      APP_TAGLINE: "${APP_TAGLINE:-}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      DEMO_MODE_RESET_CRON: "${DEMO_MODE_RESET_CRON:-0 * * * *}"
      DEMO_MODE_RESET_COURSES: "${DEMO_MODE_RESET_COURSES:-10}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8000}"
      KV_PATH: "${KV_PATH:-.data/aid-org-courses.kv}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-admin@example.org}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-session}"
      TRUSTED_CLIENT_IP_HEADER: "${TRUSTED_CLIENT_IP_HEADER:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_DEV_EXPOSE_MAGIC_LINK: "${AUTH_DEV_EXPOSE_MAGIC_LINK:-false}"
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: "${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}"
      AUTH_RATE_LIMIT_WINDOW_MINUTES: "${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}"
      AUTH_RATE_LIMIT_BLOCK_MINUTES: "${AUTH_RATE_LIMIT_BLOCK_MINUTES:-15}"
      MAGIC_LINK_TTL_MINUTES: "${MAGIC_LINK_TTL_MINUTES:-15}"
      SESSION_IDLE_TTL_DAYS: "${SESSION_IDLE_TTL_DAYS:-7}"
      SESSION_ABSOLUTE_TTL_DAYS: "${SESSION_ABSOLUTE_TTL_DAYS:-30}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Aid Org Courses}"
      MAIL_ADMIN_NOTIFICATION_TO: "${MAIL_ADMIN_NOTIFICATION_TO:-}"
      APP_TIME_ZONE: "${APP_TIME_ZONE:-Europe/Berlin}"
      AUTH_MAGIC_LINK_BINDING_COOKIE_NAME: "${AUTH_MAGIC_LINK_BINDING_COOKIE_NAME:-ml_bind}"
      REGISTRATION_DOUBLE_OPT_IN_TTL_HOURS: "${REGISTRATION_DOUBLE_OPT_IN_TTL_HOURS:-48}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      NODE_ENV: "${NODE_ENV:-production}"
      PAYPAL_ENVIRONMENT: "${PAYPAL_ENVIRONMENT:-sandbox}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      LEGAL_ORGANIZATION_NAME: "${LEGAL_ORGANIZATION_NAME:-Aid Org Courses}"
      LEGAL_REPRESENTATIVE: "${LEGAL_REPRESENTATIVE:-Max Mustermann}"
      LEGAL_STREET: "${LEGAL_STREET:-Musterstrasse 1}"
      LEGAL_POSTAL_CODE: "${LEGAL_POSTAL_CODE:-12345}"
      LEGAL_CITY: "${LEGAL_CITY:-Musterstadt}"
      LEGAL_EMAIL: "${LEGAL_EMAIL:-kontakt@example.org}"
      LEGAL_PHONE: "${LEGAL_PHONE:-+49 000 000000}"
      EMBED_ALLOWED_ORIGINS: "${EMBED_ALLOWED_ORIGINS:-*}"
    ports:
      - "8000:8000"
    volumes:
      - ./.data:/app/.data
